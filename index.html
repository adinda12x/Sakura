<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Lakeside Park — Sakura Realistis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="parkCanvas" aria-label="Taman danau dengan bunga sakura realistis, cahaya Pagi Sore Malam, dan warga bersantai"></canvas>

  <header class="hud-title">
    <span class="tag" id="lightingTag">Pagi · Cahaya Samping Kiri</span>
    <h1>Sakura Lakeside Park</h1>
    <p id="lightingDesc">Klik ranting/tajuk sakura untuk menaburkan kelopak, klik danau untuk riak air, klik warga untuk menyapa.</p>
  </header>

  <nav class="hud-controls" aria-label="Kontrol suasana">
    <button id="btnTime" type="button">Waktu: Pagi</button>
    <button id="btnWind" type="button">Angin: Sedang</button>
    <button id="btnBurst" type="button">Tabur Sakura</button>
    <button id="btnPause" type="button">Jeda</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
