<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Lakeside Park HD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="parkCanvas" aria-label="Taman danau sakura HD interaktif"></canvas>

  <header class="hud-title">
    <span class="tag">HD Interactive Scene</span>
    <h1>Sakura Lakeside Park</h1>
    <p>Klik pohon, danau, atau warga untuk berinteraksi.</p>
  </header>

  <nav class="hud-controls" aria-label="Kontrol suasana">
    <button id="btnTime" type="button">Suasana: Senja Emas</button>
    <button id="btnWind" type="button">Angin: Sedang</button>
    <button id="btnBurst" type="button">Tabur Sakura</button>
    <button id="btnPause" type="button">Jeda</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
